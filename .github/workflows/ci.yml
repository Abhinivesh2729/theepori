name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon (arm64); ubuntu-latest covers Linux.
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - run: go test ./...
      - name: build and smoke-test the native binary
        run: |
          make build
          file bin/tp || true
          ./bin/tp version
          ./bin/tp --help >/dev/null
      - name: install.sh syntax
        run: bash -n install.sh && sh -n install.sh
