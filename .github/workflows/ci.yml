name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon (arm64); ubuntu-latest covers Linux.
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: no secrets in tracked files
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.example$'; then
            echo "::error::.env file is tracked"; exit 1
          fi
          if git grep -nE 'sk-ant-api[0-9]{2}-[A-Za-z0-9_-]{20,}|sk-proj-[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9]{36}|AKIA[0-9A-Z]{16}'; then
            echo "::error::credential-like string in tracked files"; exit 1
          fi
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - run: go test ./...
      - name: build and smoke-test the native binary
        run: |
          make build
          file bin/tp || true
          ./bin/tp version
          ./bin/tp --help >/dev/null
      - name: install.sh syntax
        run: bash -n install.sh && sh -n install.sh
