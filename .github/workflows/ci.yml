name: ci

on:
  push:
    branches: [main, "factory/**"]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    # Target build is macOS only (ADR 0001, N12).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: no secrets in tracked files
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.example$'; then
            echo "::error::.env file is tracked"; exit 1
          fi
          if git grep -nE 'sk-ant-api[0-9]{2}-[A-Za-z0-9_-]{20,}|sk-proj-[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9]{36}|AKIA[0-9A-Z]{16}' -- ':!crates/tp-core/src/redact.rs'; then
            echo "::error::credential-like string in tracked files"; exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: desktop frontend (typecheck + build)
        working-directory: apps/desktop
        run: npm ci && npm run build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: install.sh syntax
        run: bash -n install.sh && sh -n install.sh
