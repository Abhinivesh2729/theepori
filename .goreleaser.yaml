# Release: git tag vX.Y.Z && git push --tags  (GitHub Actions runs this)
# Local dry run: goreleaser release --snapshot --clean
version: 2

project_name: tp

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: tp
    main: ./cmd/tp
    binary: tp
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux] # windows: needs a non-Unix process runner first
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/Abhinivesh2729/theepori/internal/cli.Version={{ .Version }}
      - -X github.com/Abhinivesh2729/theepori/internal/cli.Commit={{ .ShortCommit }}
      - -X github.com/Abhinivesh2729/theepori/internal/cli.Date={{ .Date }}

archives:
  - formats: [tar.gz]
    # Version-less names so install.sh can use releases/latest/download/...
    name_template: "tp_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt
  algorithm: sha256

release:
  github:
    owner: Abhinivesh2729
    name: theepori
  extra_files:
    - glob: ./install.sh

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]
