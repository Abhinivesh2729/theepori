[package]
name = "tp-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = "1.0.229"
serde_json = "1.0.154"
tp-core = { version = "0.2.0-dev", path = "../tp-core" }
